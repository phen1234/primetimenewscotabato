<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Facebook | Primetime News Cotabato</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#f4f6fb;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

}

body{

    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;

    min-height:100vh;

    overflow:hidden;

    position:relative;

}

/* GIF Background */

body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:url("images/fb-backgound.gif") center center/cover no-repeat;

    z-index:-2;

}

/* Dark Overlay */

body::after{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    linear-gradient(
        rgba(8,25,56,.65),
        rgba(8,25,56,.70)
    );

    z-index:-1;

}
.container{

    width:920px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    box-shadow:0 25px 60px rgba(0,0,0,.35);

    animation:fadeUp .8s ease;

    }

@keyframes fadeUp{

    from{

        opacity:0;
        transform:translateY(40px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
.header{

background:linear-gradient(135deg,#0B1F3A,#1F4D88);

padding:70px;

text-align:center;

color:#fff;

}

.header img{

width:220px;
margin-bottom:20px;

}

.header h1{

font-size:50px;

margin-bottom:10px;

}

.header p{

opacity:.9;
font-size:30px;

}

.social-card{

display:flex;

justify-content:space-between;

align-items:center;

padding:30px 40px;

border-bottom:1px solid #eee;

transition:.3s;

}

.social-card{

transition:.35s;

}

.social-card:hover{

background:rgba(255,255,255,.08);

transform:translateX(8px);

}

.left{

display:flex;

align-items:center;

gap:20px;


}

.icon{

width:70px;
height:70px;

border-radius:50%;

background:#1877F2;

color:#fff;

display:flex;

justify-content:center;
align-items:center;

font-size:30px;
transition:.35s;


}

.social-card:hover .icon{

transform:rotate(360deg) scale(1.12);

}

.left h2{

color:#fff;

margin-bottom:8px;

font-size:26px;

font-weight:700;

}

.left p{

color:rgba(255,255,255,.92);

font-size:17px;

font-weight:400;

}

.visit{

display:inline-flex;
align-items:center;
gap:10px;

background:linear-gradient(135deg,#E30613,#ff4f4f);

color:#fff;

padding:15px 30px;

border-radius:50px;

font-weight:600;

text-decoration:none;

transition:.35s;

box-shadow:0 10px 30px rgba(227,6,19,.35);

}

.visit:hover{

transform:translateY(-4px);

box-shadow:0 18px 40px rgba(227,6,19,.55);

}

.footer{

padding:30px;

text-align:center;

}

.back{

text-decoration:none;

color:#0B1F3A;

font-weight:600;

}
.btn{

    background:linear-gradient(135deg,#E30613,#ff4f4f);

    transition:.35s;

}

.btn:hover{

    transform:translateY(-4px);

    box-shadow:0 15px 35px rgba(227,6,19,.5);

}
.logo{

    width:130px;

    animation:float 4s ease-in-out infinite;

}

.home-btn{

display:inline-flex;
align-items:center;
gap:12px;

padding:16px 35px;

border-radius:50px;

background:#0B1F3A;

color:#fff;

text-decoration:none;

font-weight:600;

transition:.35s;

}

.home-btn:hover{

background:#E30613;

transform:translateY(-3px);

box-shadow:0 15px 35px rgba(227,6,19,.45);

}

@keyframes float{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

100%{

transform:translateY(0);

}

}

</style>

    <link rel="stylesheet" href="css/public-theme.css">
</head>

<body>

<div class="container">

<div class="header">

<h1>Connect with <br> Primetime News Cotabato</h1>

<p>Follow our official Facebook channels for breaking news, live updates and community stories.</p>

</div>

<div class="social-card">

<div class="left">

<div class="icon">

<i class="fab fa-facebook-f"></i>

</div>

<div>

<h2>Official Facebook Page</h2>

<p>Primetime news cotabato Facebook page.</p>

</div>

</div>

<a href="https://www.facebook.com/profile.php?id=61588451091418"

target="_blank"

class="visit">

Visit Page
<i class="fas fa-arrow-right"></i>

</a>

</div>

<div class="social-card">

<div class="left">

<div class="icon">

<i class="fas fa-user"></i>

</div>

<div>

<h2>Official Facebook Account</h2>

<p>Personal Account of Jasper Acosta</p>

</div>

</div>

<a href="https://www.facebook.com/liamj.acosta"

target="_blank"

class="visit">

Open Profile

<i class="fas fa-arrow-right"></i>

</a>

</div>

<div class="footer">

<a href="index.html?page=home" class="home-btn">

<i class="fas fa-house"></i>

Back to Homepage

</a>



</a>

</div>

</div>

    <script src="js/public-theme.js"></script>
</body>
</html>
