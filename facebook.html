<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook | Primetime News Cotabato</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/public-theme.css">

    <style>
        /* =========================================
           FACEBOOK PAGE
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            color: #111827;
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .facebook-page {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 70px 24px 50px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .facebook-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .facebook-header h1 {
            margin: 0 0 15px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.2;
            font-weight: 700;
            color: #111827;
        }

        .facebook-header h1 span {
            color: #e10600;
        }

        .facebook-header p {
            max-width: 650px;
            margin: 0 auto;
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        /* =========================================
           SOCIAL CARD
        ========================================= */

        .social-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;

            padding: 25px 28px;
            margin-bottom: 20px;

            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background-color .25s ease,
                border-color .25s ease;
        }

        .social-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
        }

        /* =========================================
           LEFT SIDE
        ========================================= */

        .social-card .left {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }

        /* Facebook / User Icon */

        .social-card .icon {
            flex: 0 0 58px;
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #1877f2;
            color: #ffffff;

            font-size: 25px;
        }

        .social-card:nth-of-type(3) .icon {
            background: #0b1f3a;
        }

        /* =========================================
           CARD TEXT
        ========================================= */

        .social-card h2 {
            margin: 0 0 5px;
            font-size: 18px;
            line-height: 1.35;
            font-weight: 600;
            color: #111827;
        }

        .social-card p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =========================================
           VISIT BUTTON
        ========================================= */

        .visit {
            flex: 0 0 auto;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 12px 18px;

            border-radius: 10px;

            background: #1877f2;
            color: #ffffff !important;

            text-decoration: none;
            font-size: 13px;
            font-weight: 600;

            white-space: nowrap;

            transition:
                transform .2s ease,
                background-color .2s ease;
        }

        .visit:hover {
            background: #0d65d9;
            transform: translateX(2px);
        }

        /* =========================================
           FOOTER
        ========================================= */

        .facebook-footer {
            text-align: center;
            margin-top: 40px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 12px 20px;

            border-radius: 10px;

            background: #0b1f3a;
            color: #ffffff !important;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition:
                transform .2s ease,
                background-color .2s ease;
        }

        .home-btn:hover {
            background: #162f53;
            transform: translateY(-2px);
        }

        /* =========================================
           DARK MODE
        ========================================= */

        body.dark-mode {
            background: #0b1220 !important;
        }

        body.dark-mode .facebook-header h1 {
            color: #ffffff !important;
        }

        body.dark-mode .facebook-header p {
            color: #aebbd0 !important;
        }

        body.dark-mode .social-card {
            background: #111c2e !important;
            border-color: #263752 !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        body.dark-mode .social-card:hover {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        body.dark-mode .social-card h2 {
            color: #ffffff !important;
        }

        body.dark-mode .social-card p {
            color: #aebbd0 !important;
        }

        body.dark-mode .home-btn {
            background: #17243a;
            border: 1px solid #344967;
        }

        body.dark-mode .home-btn:hover {
            background: #21324d;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .facebook-page {
                padding: 45px 16px 35px;
            }

            .facebook-header {
                margin-bottom: 30px;
            }

            .facebook-header h1 {
                font-size: 29px;
            }

            .facebook-header p {
                font-size: 13px;
                line-height: 1.6;
            }

            .social-card {
                flex-direction: column;
                align-items: stretch;
                gap: 18px;

                padding: 20px;
                border-radius: 15px;
            }

            .social-card .left {
                gap: 14px;
            }

            .social-card .icon {
                flex-basis: 50px;
                width: 50px;
                height: 50px;
                border-radius: 13px;
                font-size: 21px;
            }

            .social-card h2 {
                font-size: 16px;
            }

            .social-card p {
                font-size: 12px;
            }

            .visit {
                width: 100%;
                padding: 12px 15px;
            }

            .facebook-footer {
                margin-top: 30px;
            }

            .home-btn {
                width: 100%;
            }
        }

        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .facebook-page {
                padding-left: 12px;
                padding-right: 12px;
            }

            .facebook-header h1 {
                font-size: 26px;
            }

            .social-card {
                padding: 17px;
            }

            .social-card .left {
                gap: 11px;
            }

            .social-card .icon {
                flex-basis: 45px;
                width: 45px;
                height: 45px;
                font-size: 19px;
            }

            .social-card h2 {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="facebook-page">

        <header class="facebook-header">
            <h1>
                Connect with<br>
                <span>Primetime News Cotabato</span>
            </h1>

            <p>
                Follow our official Facebook channels for breaking news,
                live updates and community stories.
            </p>
        </header>


        <!-- OFFICIAL PAGE -->

        <div class="social-card">

            <div class="left">

                <div class="icon">
                    <i class="fab fa-facebook-f"></i>
                </div>

                <div>
                    <h2>Official Facebook Page</h2>

                    <p>
                        Primetime News Cotabato Facebook page.
                    </p>
                </div>

            </div>

            <a href="https://www.facebook.com/profile.php?id=61588451091418"
               target="_blank"
               rel="noopener noreferrer"
               class="visit">

                Visit Page

                <i class="fas fa-arrow-right"></i>

            </a>

        </div>


        <!-- OFFICIAL ACCOUNT -->

        <div class="social-card">

            <div class="left">

                <div class="icon">
                    <i class="fas fa-user"></i>
                </div>

                <div>
                    <h2>Official Facebook Account</h2>

                    <p>
                        Personal Account of Jasper Acosta
                    </p>
                </div>

            </div>

            <a href="https://www.facebook.com/liamj.acosta"
               target="_blank"
               rel="noopener noreferrer"
               class="visit">

                Open Profile

                <i class="fas fa-arrow-right"></i>

            </a>

        </div>


        <!-- FOOTER -->

        <footer class="facebook-footer">

            <a href="index.html?page=home" class="home-btn">

                <i class="fas fa-house"></i>

                Back to Homepage

            </a>

        </footer>

    </main>


    <!-- YOUR EXISTING THEME SYSTEM -->

    <script src="js/public-theme.js"></script>

</body>

</html>
