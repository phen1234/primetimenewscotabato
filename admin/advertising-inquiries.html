<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advertising Inquiries</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/advertising-inquiries.css">
</head>

<body>

    

    <div class="inquiries-page">

        <div class="inquiries-header">

            <div class="header-left">

                <button id="backBtn" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                </button>

                <div>
                    <h1>
                        <i class="fas fa-bullhorn"></i>
                        Advertising Inquiries
                    </h1>

                    <p>
                        Manage all advertising inquiries
                    </p>
                </div>

            </div>

            <div class="header-count">

                <i class="fas fa-bullhorn"></i>

                <span id="inquiryCount">0</span>

                <small>Inquiries</small>

            </div>

        </div>

        <div class="bulk-actions">

    <label class="select-all">
        <input type="checkbox" id="selectAllInquiries">
        <span>Mark All</span>
    </label>

    <button id="deleteSelectedBtn" class="delete-selected-btn" disabled>
        <i class="fas fa-trash"></i>
        Delete Selected
        <span id="selectedCount">0</span>
    </button>

</div>


        <!-- FILTER -->

        <div class="filter-bar">

            <div class="search-box">

                <i class="fas fa-search"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search business, contact, email..."
                >

            </div>


            <select id="statusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="new">
                    New
                </option>

                <option value="read">
                    Read
                </option>

            </select>

        </div>


        <!-- LIST -->

        <div id="inquiryList" class="inquiry-list">

            <div class="loading">

                <i class="fas fa-spinner fa-spin"></i>

                <p>
                    Loading inquiries...
                </p>

            </div>

        </div>

    </div>


    <script type="module"
        src="../js/advertising-inquiries.js"></script>

</body>

</html>
