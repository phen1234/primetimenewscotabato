<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Video | Primetime News CMS</title>

<link rel="stylesheet" href="../css/add-video.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="page">

    <div class="page-header">

        <div class="header-left">

            <a href="dashboard.html" class="backBtn">
                <i class="fas fa-arrow-left"></i>
                Back
            </a>

            <div class="titleBox">
                <h1>
                    <i class="fas fa-video"></i>
                    Add New Video
                </h1>
                <p>Publish YouTube videos to your website.</p>
            </div>

        </div>

    </div>

    <div class="card">

        <form id="videoForm">

            <div class="form-group">

                <label>YouTube URL</label>

                <input
                    type="url"
                    id="youtubeUrl"
                    placeholder="https://www.youtube.com/watch?v=xxxxxxxx"
                    required>

            </div>

            <div class="form-group">

                <label>Video Title</label>

                <input
                    type="text"
                    id="videoTitle"
                    placeholder="Enter video title"
                    required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="videoDescription"
                    rows="5"
                    placeholder="Short description"></textarea>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Category</label>

                    <select id="videoCategory">
                        <option>Local News</option>
                        <option>Police Report</option>
                        <option>Political News</option>
                        <option>Weather</option>
                        <option>National News</option>
                        <option>International News</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Author</label>

                    <input
                        type="text"
                        id="videoAuthor"
                        placeholder="Reporter name">

                </div>

            </div>

            <div class="preview-wrapper">

                <img
                    id="thumbnailPreview"
                    src="../images/no-thumbnail.png"
                    alt="Thumbnail">

                <iframe
                    id="youtubePreview"
                    width="100%"
                    height="400"
                    style="display:none;border-radius:12px;"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox" id="featuredVideo">
                    ⭐ Featured Video
                </label>

            </div>

            <div class="button-group">

                <button type="submit" class="publish-btn">
                    <i class="fas fa-paper-plane"></i>
                    Publish Video
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="history.back()">
                    <i class="fas fa-times"></i>
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>

<script type="module" src="../js/add-video.js"></script>

</body>
</html>
