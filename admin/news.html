<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="../css/news.css">

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="header">

        <div class="headerLeft">

            <a href="dashboard.html" class="backBtn">
                <i class="fas fa-arrow-left"></i>
                Back
            </a>

            <div class="titleBox">

                <h1>
                    <i class="fas fa-newspaper"></i>
                    News Management
                </h1>

                <p>
                    View, edit and delete published news.
                </p>

            </div>

        </div>

    </div>


    <!-- FILTERS -->

    <div class="contentFilter">

        <button class="filterBtn active" data-type="all">
            <i class="fas fa-layer-group"></i>
            All
        </button>

        <button class="filterBtn" data-type="news">
            <i class="fas fa-newspaper"></i>
            News Articles
        </button>

        <button class="filterBtn" data-type="video">
            <i class="fab fa-youtube"></i>
            Videos
        </button>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <a href="add-news.html" class="addBtn">

            <i class="fas fa-plus-circle"></i>

            Add News

        </a>

        <div class="toolbarRight">

            <div class="searchBox">

                <i class="fas fa-search"></i>

                <input
                    type="text"
                    id="searchNews"
                    placeholder="Search headline...">

            </div>

            <div class="filter-bar">

                <input
                    type="date"
                    id="dateFilter">

                <button type="button" id="clearDate">
    <i class="fas fa-xmark"></i> Clear
</button>

            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="card">

        <table>

            <thead>

<tr>

<th style="width:95px;">Image</th>

<th>Headline</th>

<th style="width:160px;">Category</th>

<th style="width:170px;">Author</th>

<th style="width:180px;">Status</th>

<th style="width:100px;text-align:center;">Action</th>

</tr>

</thead>

            <tbody id="newsTable">

                <tr>

                    <td colspan="6" style="text-align:center;padding:40px;">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script type="module" src="../js/news.js"></script>
<script type="module" src="../js/permissions.js"></script>
<script type="module" src="../js/online-status.js"></script>

</body>

</html>
