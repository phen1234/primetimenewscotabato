<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add News | Primetime News CMS</title>

<link rel="stylesheet" href="../css/add-news.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

    <img
        id="siteLogo"
        src="../images/PRIMETIME NEWS LOGO.png"
        alt="siteLogo">

    <h2 id="siteName">
        Loading...
    </h2>

</div>
<ul>

<li>
<a href="dashboard.html">
<i class="fas fa-chart-line"></i>
<span>Dashboard</span>
</a>
</li>

<li class="active">
<a href="add-news.html">
<i class="fas fa-plus-circle"></i>
<span>Add News</span>
</a>
</li>

<li>
<a href="analytics.html">
<i class="fas fa-chart-line"></i>
<span>Analytics</span>
</a>
</li>

<li>
<a href="categories.html">
<i class="fas fa-folder"></i>
<span>Categories</span>
</a>
</li>

<li>
<a href="users.html">
<i class="fas fa-users"></i>
<span>Accounts</span>
</a>
</li>

<li>
<a href="settings.html">
<i class="fas fa-gear"></i>
<span>Settings</span>
</a>
</li>

<li>
    <a href="#" id="logoutBtn">
        <i class="fas fa-right-from-bracket"></i>
        <span>Logout</span>
    </a>
</li>

</ul>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<h1>Create News Article</h1>

<div class="actions">

    <button class="previewBtn">
        <i class="fas fa-eye"></i>
        Preview
    </button>

    <button id="publishNews" class="publishBtn">
        <i class="fas fa-paper-plane"></i>
        Publish News
    </button>

</div>

</div>

<div class="form-group">
    <label class="checkbox-label">
        <input type="checkbox" id="pinNews">
        📌 Pin this news
    </label>
</div>

<div class="editor-layout">

<!-- LEFT -->

<div class="editor-card">

<label>Headline</label>

<input
type="text"
id="headline"
placeholder="Enter News Headline">

<label>Category</label>

<select id="category">

    <option value="">Loading Categories...</option>

</select>

<label>Short Summary</label>

<textarea
id="summary"
rows="4"
placeholder="Write a short summary..."></textarea>

<label>News Content</label>

<div id="editor"></div>

<label>SEO Keywords</label>

<input
type="text"
placeholder="Example: BARMM, Cotabato, MILG">

<label>Tags</label>

<input
type="text"
placeholder="Politics, BARMM">

</div>

<!-- RIGHT -->

<div class="sidebar-card">

<h3>Publish Settings</h3>


<div class="status-card">

    <div class="status-left">
        <span class="status-dot"></span>

        <div>
            <h4>Publish Date</h4>
            <p id="publishDate"></p>
        </div>
    </div>

</div>
</br>
</br>
<!-- ===========================
MEDIA UPLOADER
=========================== -->

<div class="media-card">

    <h3>Gallery Images</h3>

    <!-- DROP ZONE -->
    <div id="dropZone" class="dropZone">




        <button
            type="button"
            id="uploadBtn"
            class="chooseBtn">

            <i class="fas fa-plus"></i>
            Add Images

        </button>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            multiple
            hidden>

    </div>

    <!-- GALLERY -->
    <div id="galleryPreview" class="galleryPreview">

        <div class="emptyGallery">

     

        </div>

    </div>

    <!-- FEATURED -->
    <h3 style="margin-top:25px;">Featured Image</h3>

    <div id="featuredPreview" class="featuredPreview">

        <div class="emptyFeatured">

            <i class="fas fa-image"></i>

            <p>No featured image</p>

        </div>

    </div>

</div>

<div class="info-box">

<label>Author</label>

<select id="author">

<option value="">Select Author</option>

</select>

<a href="authors.html" class="registerAuthorBtn">
    <i class="fas fa-user-plus"></i>
    Register Author
</a>

<hr>

<p><strong>Reading Time</strong></p>

<p id="readingTime">0 min</p>

<hr>

<p><strong>Word Count</strong></p>

<p id="wordCount">0</p>

</div>

</div>

</div>

</div>


   <!-- ===========================
LOADING OVERLAY
=========================== -->

<div id="loadingOverlay" class="loadingOverlay">

    <div class="loadingCard">

        <div class="spinner"></div>

        <h2 id="loadingText">
            Preparing Article...
        </h2>

    </div>

</div>

<!-- Scripts -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script type="module" src="../js/add-news.js"></script>
<script type="module" src="../js/permissions.js"></script>
<script type="module" src="../js/website-settings.js"></script>

</body>
</html>
