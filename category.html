<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latest News | Primetime News Cotabato</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/category.css">

    <link rel="stylesheet" href="css/public-theme.css">
</head>

<body>

<!-- HERO HEADER -->

<section class="categoryHero">

    <div class="container">

        <span class="categoryBadge">PRIMETIME NEWS</span>

        <h1 id="pageTitle">Latest News</h1>

        <p id="pageDescription">

            Breaking stories, community updates, police reports,
            politics, weather and national news.

        </p>

    </div>

</section>

<!-- SEARCH -->

<section class="searchSection">

<div class="container">

<div class="searchBox">

<i class="fas fa-search"></i>

<input
type="text"
id="searchNews"
placeholder="Search latest news...">

</div>

</div>

</section>

<!-- CATEGORY MENU -->

<section class="categoryMenuSection">

<div class="container">

<div class="categoryMenu">

<button class="active" data-category="All">

All

</button>

<button data-category="Local News">

Local

</button>

<button data-category="Police Report">

Police

</button>

<button data-category="Political News">

Politics

</button>

<button data-category="Weather Update">

Weather

</button>

<button data-category="National News">

National

</button>

<button data-category="International News">

International

</button>

</div>

</div>

</section>

<!-- CONTENT -->

<section class="categoryContent">

<div class="container categoryGrid">

<!-- LEFT -->

<main>

<!-- FEATURED -->

<div id="featuredNews"></div>

<h2 class="sectionHeading">

Latest Stories

</h2>

<div id="categoryNews"></div>

<div id="pagination"></div>

<section class="categoryVideos">

    <div class="section-title">

        <h2>
            <i class="fas fa-play-circle"></i>
            Latest Videos
        </h2>

    </div>

    <div id="categoryVideos" class="video-grid"></div>

</section>

</main>

<!-- RIGHT -->

<aside>

<div class="widget">

<h3>

🔥 Trending News

</h3>

<div id="trendingNews"></div>

</div>

<div class="widget">

<h3>



📺 Latest Videos

</h3>

<div id="latestVideos"></div>

</div>

<div class="widget">

<h3>

📱 Follow Us

</h3>

<div class="social">

<a href="#">

<i class="fab fa-facebook-f"></i>

Facebook

</a>

<a href="https://www.youtube.com/@PRIMETIMENEWSCOTABATO"
target="_blank">

<i class="fab fa-youtube"></i>

YouTube

</a>

</div>

</div>

</aside>

</div>

</section>

<script type="module" src="js/category.js"></script>

<div id="videoModal" class="video-modal">

    <div class="video-modal-content">

        <span id="closeVideo">&times;</span>

        <iframe
            id="videoFrame"
            allowfullscreen>
        </iframe>

    </div>

</div>

    <script src="js/public-theme.js"></script>
</body>

</html>
