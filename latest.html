<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latest News & Videos | Primetime News Cotabato</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/latest.css">

    <link rel="stylesheet" href="css/public-theme.css">
</head>

<body>

<!-- HERO -->

<section class="hero">

    <div class="hero-container">

        <h1>Latest News & Videos</h1>

        <p>
            Stay updated with the latest breaking news and video reports.
        </p>

    </div>

</section>

<!-- SEARCH -->

<section class="search-section">

<div class="container">

<div class="search-box">

<i class="fas fa-search"></i>

<input
id="searchInput"
type="text"
placeholder="Search News or Videos...">

</div>

</div>

</section>

<!-- CATEGORY -->

<section class="category-section">

<div class="container">

<div class="category-menu">

<button class="active" data-category="All">All</button>

<button data-category="Local News">Local</button>

<button data-category="Police Report">Police</button>

<button data-category="Political News">Politics</button>

<button data-category="Weather Update">Weather</button>

<button data-category="National News">National</button>

<button data-category="International News">International</button>

</div>

</div>

</section>

<!-- TABS -->

<section class="content-switch">

<div class="container">

<div class="switch-tabs">

<button id="newsTab" class="tab active">

<i class="fas fa-newspaper"></i>

News Articles

</button>

<button id="videoTab" class="tab">

<i class="fab fa-youtube"></i>

Videos

</button>

</div>

</div>

</section>

<!-- MAIN -->

<section class="latest-content">

<div class="container">

<div class="content-layout">

<!-- LEFT -->

<div class="content-main">

<div class="section-title">

    <h2 id="sectionTitle">
        Latest News
    </h2>

</div>

<div id="featuredContent">

</div>

<div id="contentList">

</div>

<div id="pagination">

</div>

</div>

<!-- RIGHT -->

<aside class="content-sidebar">

<div id="sidebarContent">

</div>

</aside>

</div>

</div>

</section>



<!-- VIDEO MODAL -->

<div id="videoModal" class="video-modal">

<div class="video-modal-content">

<span id="closeVideo">

&times;

</span>

<iframe
id="videoFrame"
src=""
allowfullscreen>

</iframe>

<div class="video-details">

<span
id="videoCategory"
class="video-category">

</span>

<h2 id="videoTitle">

</h2>

<p id="videoDescription">

</p>

</div>

</div>

</div>

<!-- FOOTER -->

<footer>

<div class="container">

<h2>

Primetime News Cotabato

</h2>

<p>

© 2026 Primetime News Cotabato

</p>

</div>

</footer>

<script type="module" src="js/latest.js"></script>


    <script src="js/public-theme.js"></script>
</body>

</html>
